<div class="main-container">
  <h1>Gestão de Benefícios</h1>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th style="text-align: right;">Saldo</th>
          <th style="text-align: center;">Versão (Locking)</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let b of beneficios">
          <td><strong>#{{ b.id }}</strong></td>
          <td>{{ b.nome }}</td>
          <td style="text-align: right; color: #28a745; font-weight: bold;">
            {{ b.valor | currency:'BRL' }}
          </td>
          <td style="text-align: center;">
            <span style="background: #e9ecef; padding: 2px 8px; border-radius: 10px;">{{ b.version }}</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

  <h3>Nova Transferência</h3>
  <div class="form-transferencia">
    <div style="display: flex; flex-direction: column;">
      <small>Origem (ID)</small>
      <input type="number" [(ngModel)]="idOrigem" placeholder="Ex: 1">
    </div>

    <div style="align-self: center; font-size: 20px; padding-top: 15px;">➡️</div>

    <div style="display: flex; flex-direction: column;">
      <small>Destino (ID)</small>
      <input type="number" [(ngModel)]="idDestino" placeholder="Ex: 2">
    </div>

    <div style="display: flex; flex-direction: column;">
      <small>Valor R$</small>
      <input type="number" [(ngModel)]="valorTransferir" placeholder="0.00">
    </div>

    <button (click)="transferir()" style="align-self: flex-end;">
      Confirmar Transferência
    </button>
  </div>
</div>
